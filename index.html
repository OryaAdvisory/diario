<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Voice Journal</title>
<meta name="theme-color" content="#f5f0e6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Voice Journal">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f5f0e6;--card:#fbf8f2;--line:#e6dccb;--txt:#4a4238;--muted:#8a7f70;
  --acc:#9c7a4f;--acc-soft:#ece1cf;--warn:#b0705a;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto}
/* Topo fixo */
.top{flex:none;padding:calc(10px + var(--safe-t)) 14px 6px;border-bottom:1px solid var(--line);background:var(--bg)}
.bar{display:flex;align-items:center;gap:8px}
.brand{flex:1;min-width:0;line-height:1.15}
.brand .bt{font-size:20px;font-weight:700;white-space:nowrap}
.brand .bs{font-size:11.5px;color:var(--muted);letter-spacing:.3px;margin-left:30px}
.tabs{display:flex;gap:6px;margin-top:10px}
.tabs button{flex:1;height:44px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-size:15px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--acc-soft);border-color:var(--acc);color:var(--txt)}
.cloud{flex:1;overflow-y:auto;padding:16px 14px calc(96px + var(--safe-b));display:flex;flex-wrap:wrap;align-content:center;justify-content:center;align-items:center;gap:4px 12px}
.cloud .w{border:0;background:none;padding:2px 3px;line-height:1.1;font-weight:600;border-radius:8px}
.cloud .w:active{background:var(--acc-soft)}
.cloud .c0{color:#9c7a4f}.cloud .c1{color:#7d8a6a}.cloud .c2{color:#a86f5b}.cloud .c3{color:#6f7f8f}.cloud .c4{color:#8a6f8f}
.cloud .empty{width:100%}
.icon-btn{border:1px solid var(--line);background:var(--card);border-radius:10px;height:36px;min-width:36px;padding:0 9px;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.icon-btn small{font-size:13px}
.filters{display:flex;gap:6px;margin-top:8px}
.filters select,.filters input{height:36px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0 8px;min-width:0}
.filters select{flex:1 1 auto;max-width:none}
.filters:has(input:not([hidden])) select{flex:0 0 auto;max-width:42%}
.filters input{flex:1}
.words{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;max-height:62px;overflow:hidden}
.words.open{max-height:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:2px 9px;font-size:13px;white-space:nowrap}
.chip b{font-weight:600;color:var(--muted);font-size:11px;margin-left:3px}
.chip.l2{font-size:14px}.chip.l3{font-size:15px;font-weight:600}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip.on b{color:#f3e9da}
.chip.more{color:var(--muted)}
.info{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);margin-top:6px;min-height:18px}
.info button{border:0;background:none;color:var(--acc);padding:0;font-size:12.5px}
/* Lista */
.list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 14px calc(96px + var(--safe-b))}
.day{font-size:12px;font-weight:600;color:var(--muted);margin:12px 2px 5px}
.day:first-child{margin-top:4px}
.entry{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:7px}
.entry .h{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.entry .t{margin-top:2px;white-space:pre-wrap;word-wrap:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.entry.open .t{display:block}
.entry mark{background:#efdcb8;color:inherit;border-radius:3px;padding:0 1px}
.entry .acts{display:none;gap:8px;margin-top:8px}
.entry.open .acts{display:flex}
.entry .acts button{flex:1;height:38px;border:1px solid var(--line);background:var(--bg);border-radius:10px}
.entry .acts .del{color:var(--warn)}
.empty{text-align:center;color:var(--muted);padding:40px 20px}
.empty .big{font-size:42px}
/* Botão principal */
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + var(--safe-b));width:min(612px,calc(100% - 28px));height:58px;border:0;border-radius:16px;background:var(--acc);color:#fff;font-size:18px;font-weight:600;box-shadow:0 4px 14px rgba(120,90,50,.25);display:flex;align-items:center;justify-content:center;gap:8px}
/* Folhas (ecrãs por cima) */
.sheet{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:10}
.sheet.show{display:flex}
.sheet .sh{flex:none;display:flex;align-items:center;gap:8px;padding:calc(10px + var(--safe-t)) 14px 10px;border-bottom:1px solid var(--line)}
.sheet .sh h2{margin:0;font-size:18px;flex:1;white-space:nowrap}
.sheet .sb{flex:1;overflow-y:auto;padding:12px 14px}
.sheet .sf{flex:none;display:flex;gap:8px;padding:10px 14px calc(12px + var(--safe-b));border-top:1px solid var(--line)}
.btn{flex:1;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.lbl{font-size:12.5px;color:var(--muted);margin:10px 2px 4px;display:block}
.lbl:first-child{margin-top:0}
.field{width:100%;height:44px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:0 10px}
textarea.field{height:auto;min-height:46vh;padding:10px;resize:none;line-height:1.5}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:12px 8px;text-align:center}
.opt .i{font-size:26px;display:block}
.opt .n{font-weight:600;font-size:14px}
.opt .d{font-size:12px;color:var(--muted)}
.opt.on{border-color:var(--acc);background:var(--acc-soft)}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.check{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px}
.check input{width:22px;height:22px;accent-color:var(--acc)}
.menu{display:flex;flex-direction:column;gap:8px}
.menu button{display:flex;align-items:center;gap:12px;text-align:left;height:58px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:0 14px;font-size:16px}
.menu button .i{font-size:22px;width:28px;text-align:center}
.menu button span.s{display:block;font-size:12px;color:var(--muted)}
.sum{background:var(--acc-soft);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:14px}
/* PIN */
.lock{position:fixed;inset:0;background:var(--bg);z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
.lock.show{display:flex}
.lock .big{font-size:44px}
.lock input{width:200px;height:52px;text-align:center;font-size:24px;letter-spacing:8px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.lock .err{color:var(--warn);font-size:13px;min-height:18px}
/* Gravação */
#sRec{background:var(--bg)}
.rec-top{display:flex;align-items:center;justify-content:center;gap:10px;padding:calc(18px + var(--safe-t)) 14px 8px}
.dot{width:16px;height:16px;border-radius:50%;background:#c0574a;animation:pulse 1.2s infinite}
.paused .dot{animation:none;background:var(--muted)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
.timer{font-size:28px;font-weight:650;font-variant-numeric:tabular-nums}
.rec-state{text-align:center;font-size:13px;color:var(--muted);min-height:18px}
.live{flex:1;overflow-y:auto;margin:10px 14px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;font-size:16px;line-height:1.5;resize:none;width:auto;font-family:inherit;color:var(--txt);outline:none}
.kb{margin:8px 14px 0;padding:10px 12px;border-radius:14px;background:var(--acc-soft);text-align:center;font-size:14px;color:var(--txt)}
.kb .btn{margin-top:8px;width:100%;flex:none;height:54px}
.kb .retry{margin-top:6px;border:0;background:none;color:var(--acc);font-size:13px}
.live .int{color:var(--muted)}
.live .ph{color:var(--muted);font-style:italic}
.alarm{display:none;margin:0 14px;padding:14px;border-radius:14px;background:#c0574a;color:#fff;font-weight:600;text-align:center;font-size:16px}
.alarm.show{display:block}
.rec-btns{display:flex;gap:8px;padding:10px 14px calc(14px + var(--safe-b))}
.rec-btns .btn{height:64px;font-size:18px}
.rec-btns .stop{flex:2}
.entry .h .au{margin-left:6px}
.entry audio{width:100%;margin-top:8px;height:36px}
.menu label.tg{display:flex;align-items:center;gap:12px;height:58px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:0 14px;font-size:16px}
.menu label.tg .i{font-size:22px;width:28px;text-align:center}
.menu label.tg input{margin-left:auto;width:24px;height:24px;accent-color:var(--acc)}
.menu label.tg span.s{display:block;font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:var(--txt);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;white-space:nowrap}
.toast.show{opacity:.95}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="bar">
      <div class="brand"><div class="bt">🎙️ Voice Journal</div><div class="bs">by Orya Advisory</div></div>
      <button class="icon-btn" id="bExport" aria-label="Exportar">📤 <small>Exportar</small></button>
      <button class="icon-btn" id="bSettings" aria-label="Definições">⚙️</button>
    </div>
    <div class="tabs" id="tabs"><button data-v="cloud" class="on">☁️ Temas</button><button data-v="list">📖 Registos</button></div>
    <div class="filters">
      <select id="fPeriod" aria-label="Período">
        <option value="all">📅 Tudo</option>
        <option value="7">📅 7 dias</option>
        <option value="30">📅 30 dias</option>
        <option value="month">📅 Este mês</option>
        <option value="lastmonth">📅 Mês passado</option>
        <option value="year">📅 Este ano</option>
      </select>
      <input id="fSearch" type="search" placeholder="🔍 Pesquisar" autocomplete="off" hidden>
    </div>
    <div class="words" id="words"></div>
    <div class="info"><span id="count"></span><button id="bClear" hidden>✕ Limpar filtros</button></div>
  </div>
  <div class="cloud" id="cloud"></div>
  <div class="list" id="list" hidden></div>
</div>
<button class="fab" id="bNew">🎙️ Novo Registo</button>

<!-- Novo / editar registo -->
<div class="sheet" id="sEdit">
  <div class="sh"><h2 id="eTitle">🎙️ Novo Registo</h2></div>
  <div class="sb">
    <label class="lbl" for="eDate">Data e hora</label>
    <input class="field" id="eDate" type="datetime-local">
    <label class="lbl" for="eText">Texto</label>
    <textarea class="field" id="eText" placeholder="Toca no 🎤 do teclado e fala, ou cola aqui a transcrição."></textarea>
  </div>
  <div class="sf">
    <button class="btn" id="eCancel">Cancelar</button>
    <button class="btn pri" id="eSave">✔️ Guardar</button>
  </div>
</div>

<!-- Gravar -->
<div class="sheet" id="sRec">
  <div class="rec-top"><span class="dot"></span><span class="timer" id="rTimer">0:00</span></div>
  <div class="rec-state" id="rState">A ouvir…</div>
  <div class="alarm" id="rAlarm">⚠️ A gravação parou<br><small>Toca aqui para continuar</small></div>
  <div class="kb" id="rKb" hidden><span id="rKbMsg"></span><button class="btn pri" id="rKbBtn">⌨️ Ditar pelo Teclado</button><button class="retry" id="rAuto" hidden>🔄 Tentar a transcrição automática</button></div>
  <textarea class="live" id="rText" placeholder="Começa a falar…"></textarea>
  <div class="rec-btns">
    <button class="btn" id="rCancel">✕ Cancelar</button>
    <button class="btn pri stop" id="rSave">✔️ Parar e Guardar</button>
  </div>
</div>

<!-- Exportar -->
<div class="sheet" id="sExport">
  <div class="sh"><h2>📤 Exportar</h2><button class="icon-btn" data-close aria-label="Fechar">✕</button></div>
  <div class="sb">
    <label class="lbl" for="xPeriod">Período</label>
    <select class="field" id="xPeriod">
      <option value="all">Tudo</option>
      <option value="7">Últimos 7 dias</option>
      <option value="30">Últimos 30 dias</option>
      <option value="month">Este mês</option>
      <option value="lastmonth">Mês passado</option>
      <option value="year">Este ano</option>
      <option value="custom">Escolher datas</option>
    </select>
    <div class="row2" id="xCustom" hidden>
      <div><label class="lbl" for="xFrom">De</label><input class="field" id="xFrom" type="date"></div>
      <div><label class="lbl" for="xTo">Até</label><input class="field" id="xTo" type="date"></div>
    </div>
    <label class="check" id="xWordRow" hidden><input type="checkbox" id="xWord"><span id="xWordTxt"></span></label>
    <span class="lbl">Formato</span>
    <div class="opts" id="xFmt">
      <button class="opt on" data-v="txt"><span class="i">📄</span><span class="n">Texto</span><div class="d">.txt simples</div></button>
      <button class="opt" data-v="md"><span class="i">🗒️</span><span class="n">Notion</span><div class="d">.md com títulos</div></button>
    </div>
    <div class="sum" id="xSum"></div>
  </div>
  <div class="sf">
    <button class="btn" id="xCopy">📋 Copiar</button>
    <button class="btn pri" id="xGo">💾 Guardar Ficheiro</button>
  </div>
</div>

<!-- Definições -->
<div class="sheet" id="sSettings">
  <div class="sh"><h2>⚙️ Definições</h2><button class="icon-btn" data-close aria-label="Fechar">✕</button></div>
  <div class="sb">
    <div class="menu">
      <button id="mBackup"><span class="i">💾</span><span>Cópia de Segurança<span class="s">Guarda tudo num ficheiro, para mudar de telemóvel</span></span></button>
      <button id="mImport"><span class="i">📥</span><span>Importar<span class="s">Cópia de segurança ou ficheiro .md exportado</span></span></button>
      <label class="tg"><span class="i">🎧</span><span>Guardar Também o Áudio<span class="s">Para ouvir depois; ocupa mais espaço</span></span><input type="checkbox" id="mAudio"></label>
      <button id="mPin"><span class="i">🔒</span><span id="mPinTxt">Definir PIN</span></button>
    </div>
    <input type="file" id="fileIn" accept=".json,.md,.txt,application/json,text/plain,text/markdown" hidden>
    <p class="hint" id="sInfo"></p>
  </div>
</div>

<!-- PIN -->
<div class="lock" id="lock">
  <div class="big">🔒</div>
  <div id="lockMsg">Introduz o PIN</div>
  <input id="lockIn" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off">
  <div class="err" id="lockErr"></div>
  <button class="btn pri" id="lockGo" style="flex:none;width:200px">Entrar</button>
  <button class="icon-btn" id="lockCancel" hidden>Cancelar</button>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';
/* ---------- Armazenamento (IndexedDB, só no aparelho) ---------- */
const DB={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('diario',2);
    r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('e'))d.createObjectStore('e',{keyPath:'id'});if(!d.objectStoreNames.contains('k'))d.createObjectStore('k');if(!d.objectStoreNames.contains('a'))d.createObjectStore('a')};
    r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  tx(s,m){return this.db.transaction(s,m).objectStore(s)},
  req(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  all(){return this.req(this.tx('e','readonly').getAll())},
  put(e){return this.req(this.tx('e','readwrite').put(e))},
  del(id){return this.req(this.tx('e','readwrite').delete(id))},
  putMany(list){return new Promise((res,rej)=>{const t=this.db.transaction('e','readwrite');const s=t.objectStore('e');list.forEach(x=>s.put(x));t.oncomplete=res;t.onerror=()=>rej(t.error)})},
  getK(k){return this.req(this.tx('k','readonly').get(k))},
  setK(k,v){return this.req(this.tx('k','readwrite').put(v,k))},
  delK(k){return this.req(this.tx('k','readwrite').delete(k))}
};

/* ---------- Estado ---------- */
let entries=[];               // {id,date(ISO),text}
const st={period:'all',q:'',word:null,openId:null,wordsOpen:false,editId:null,fmt:'txt',view:'cloud'};
const $=id=>document.getElementById(id);

/* ---------- Utilitários ---------- */

const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const toLocalInput=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const dayKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fDay=d=>d.toLocaleDateString('pt-PT',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const cap1=s=>s.charAt(0).toUpperCase()+s.slice(1);
const fTime=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}`;
const fShort=d=>d.toLocaleDateString('pt-PT');
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2200)}

function tokens(text){return (norm(text).match(/[a-zçñ]+(?:-[a-z]+)*/g)||[])}
const DISP=new Map(); // palavra sem acentos -> como se escreve
function learn(text){for(const w of (text.toLowerCase().match(/[\p{L}]+(?:-[\p{L}]+)*/gu)||[])){const k=norm(w);if(!DISP.has(k)||w!==k)DISP.set(k,w)}}
const disp=w=>DISP.get(w)||w;

/* ---------- Filtros ---------- */
function range(p,from,to){
  const now=new Date(),s=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  switch(p){
    case '7':return[new Date(s-6*864e5),null];
    case '30':return[new Date(s-29*864e5),null];
    case 'month':return[new Date(now.getFullYear(),now.getMonth(),1),null];
    case 'lastmonth':return[new Date(now.getFullYear(),now.getMonth()-1,1),new Date(now.getFullYear(),now.getMonth(),1)];
    case 'year':return[new Date(now.getFullYear(),0,1),null];
    case 'custom':return[from?new Date(from+'T00:00'):null,to?new Date(new Date(to+'T00:00').getTime()+864e5):null];
    default:return[null,null];
  }
}
function inRange(e,[a,b]){const d=new Date(e.date);return(!a||d>=a)&&(!b||d<b)}
function hasWord(e,w){return tokens(e.text).includes(w)}
function matchQ(e,q){if(!q)return true;const t=norm(e.text);return norm(q).split(/\s+/).filter(Boolean).every(x=>t.includes(x))}
function baseFiltered(){const r=range(st.period);return entries.filter(e=>inRange(e,r)&&matchQ(e,st.q))}

/* ---------- Desenho ---------- */
function renderWords(base){
  const freq=new Map(),shown=new Map();
  for(const e of base){
    const seen=new Set();
    for(const w of tokens(e.text)){
      if(w.length<4||STOP.has(w)||seen.has(w))continue;seen.add(w);   // conta em quantos registos aparece
      freq.set(w,(freq.get(w)||0)+1);
    }
  }
  let top=[...freq].filter(([,n])=>n>=2||base.length<3).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).slice(0,30);
  if(st.word&&!top.find(([w])=>w===st.word))top.unshift([st.word,freq.get(st.word)||0]);
  const box=$('words');
  if(!top.length){box.innerHTML='';box.hidden=true;return}
  box.hidden=st.view!=='list';
  const max=top[0][1]||1;
  box.innerHTML=top.map(([w,n])=>{const l=n>=max*.66?'l3':n>=max*.33?'l2':'';return`<button class="chip ${l}${st.word===w?' on':''}" data-w="${esc(w)}">${esc(disp(w))}<b>${n}</b></button>`}).join('');
  box.classList.toggle('open',st.wordsOpen);
  // botão "mais" quando não cabe
  requestAnimationFrame(()=>{
    if(!st.wordsOpen&&box.scrollHeight>box.clientHeight+2){
      const m=document.createElement('button');m.className='chip more';m.textContent='＋ mais';m.dataset.more='1';
      box.appendChild(m);
      while(box.scrollHeight>box.clientHeight+2&&m.previousElementSibling&&!m.previousElementSibling.classList.contains('on'))m.previousElementSibling.remove();
    }else if(st.wordsOpen){const m=document.createElement('button');m.className='chip more';m.textContent='－ menos';m.dataset.more='1';box.appendChild(m)}
  });
}
function hl(text){
  let h=esc(text);
  const terms=[];if(st.word)terms.push(st.word);if(st.q)terms.push(...norm(st.q).split(/\s+/).filter(x=>x.length>1));
  if(!terms.length)return h;
  // marcar ignorando acentos: percorre o texto normalizado em paralelo
  const n=norm(h);const marks=[];
  for(const t of terms){let i=0;while((i=n.indexOf(t,i))>-1){marks.push([i,i+t.length]);i+=t.length}}
  if(!marks.length)return h;
  marks.sort((a,b)=>a[0]-b[0]);let out='',p=0;
  for(const[a,b]of marks){if(a<p)continue;out+=h.slice(p,a)+'<mark>'+h.slice(a,b)+'</mark>';p=b}
  return out+h.slice(p);
}
function topWords(base,n){
  const freq=new Map();
  for(const e of base){const seen=new Set();
    for(const w of tokens(e.text)){if(w.length<4||STOP.has(w)||seen.has(w))continue;seen.add(w);freq.set(w,(freq.get(w)||0)+1)}}
  return [...freq].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).slice(0,n);
}
function renderCloud(base){
  const C=$('cloud');
  const top=topWords(base,45).filter(([,n])=>n>=2||base.length<4);
  if(!top.length){C.innerHTML=`<div class="empty"><div class="big">☁️</div><p>${entries.length?'Ainda não há palavras repetidas neste período.':'As palavras de que mais falas aparecem aqui.<br>Carrega em <b>Novo Registo</b> para começar.'}</p></div>`;return}
  const max=top[0][1],min=top[top.length-1][1];
  // as maiores ao centro, as outras alternadas para os lados
  const arr=[];top.forEach((x,i)=>i%2?arr.push(x):arr.unshift(x));
  C.innerHTML=arr.map(([w,n])=>{const f=max===min?1:(n-min)/(max-min);const size=Math.round(15+f*27);
    return`<button class="w c${w.length%5}" style="font-size:${size}px" data-w="${esc(w)}" title="${n} registos">${esc(disp(w))}</button>`}).join('');
}
function setView(v){st.view=v;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  $('cloud').hidden=v!=='cloud';$('list').hidden=v!=='list';$('fSearch').hidden=v!=='list';render()}
function render(){
  const base=baseFiltered();
  renderCloud(base);
  renderWords(base);
  $('words').hidden=st.view!=='list'||!$('words').innerHTML;
  const list=st.word?base.filter(e=>hasWord(e,st.word)):base;
  const L=$('list');
  const filt=st.period!=='all'||st.q||st.word;
  $('bClear').hidden=!filt;
  $('count').textContent=entries.length?`${list.length} ${list.length===1?'registo':'registos'}${filt?' de '+entries.length:''}`:'';
  if(!entries.length){L.innerHTML=`<div class="empty"><div class="big">🎙️</div><p>Ainda não há registos.<br>Carrega em <b>Novo Registo</b> para começar.</p></div>`;return}
  if(!list.length){L.innerHTML=`<div class="empty"><div class="big">🔍</div><p>Nenhum registo com estes filtros.</p></div>`;return}
  let html='',last='';
  for(const e of list){
    const d=new Date(e.date),k=dayKey(d);
    if(k!==last){html+=`<div class="day">${cap1(fDay(d))}</div>`;last=k}
    const words=e.text.trim().split(/\s+/).length;
    html+=`<div class="entry${st.openId===e.id?' open':''}" data-id="${e.id}">
      <div class="h"><span>🕒 ${fTime(d)}${e.audio?'<span class="au">🎧</span>':''}</span><span>${e.text.trim()?words+' palavras':'só áudio'}</span></div>
      <div class="t">${e.text.trim()?hl(e.text):'<i>Sem transcrição. Toca para ouvir.</i>'}</div>
      ${e.audio&&st.openId===e.id?'<audio controls preload="none" data-au="'+e.id+'"></audio>':''}
      <div class="acts"><button data-a="edit">✏️ Editar</button><button data-a="del" class="del">🗑️ Apagar</button></div></div>`;
  }
  L.innerHTML=html;
}

/* ---------- Exportar ---------- */
function exportList(){
  const p=$('xPeriod').value,r=range(p,$('xFrom').value,$('xTo').value);
  let l=entries.filter(e=>inRange(e,r));
  if(st.word&&$('xWord').checked)l=l.filter(e=>hasWord(e,st.word));
  return l.slice().reverse(); // do mais antigo para o mais recente: lê-se como um diário
}
function periodLabel(l){if(!l.length)return'';const a=new Date(l[0].date),b=new Date(l[l.length-1].date);return fShort(a)===fShort(b)?fShort(a):`${fShort(a)} a ${fShort(b)}`}
function buildText(l,fmt){
  const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
  const words=st.word&&$('xWord').checked?` · palavra «${disp(st.word)}»`:'';
  let out='',last='';
  if(fmt==='md'){
    out+=`# Voice Journal · ${periodLabel(l)}\n\n${l.length} registos${words}\n`;
    for(const e of l){const d=new Date(e.date),k=dayKey(d);
      if(k!==last){out+=`\n## ${cap(fDay(d))}\n`;last=k}
      out+=`\n### ${fTime(d)}\n\n${e.text.trim()}\n`}
  }else{
    out+=`VOICE JOURNAL · ${periodLabel(l)}\n${l.length} registos${words}\n`;
    for(const e of l){const d=new Date(e.date),k=dayKey(d);
      if(k!==last){out+=`\n\n==================================\n${cap(fDay(d)).toUpperCase()}\n==================================\n`;last=k}
      out+=`\n[${fTime(d)}]\n${e.text.trim()}\n`}
  }
  return out;
}

async function saveFile(name,content,type){
  const file=new File([content],name,{type});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return true}}
  catch(err){if(err.name==='AbortError')return false}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);return true;
}

const MONTHS=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function parseMd(txt){
  // Lê o formato exportado: "## <dia por extenso>" e "### HH:MM"
  const out=[];let day=null,cur=null;
  const flush=()=>{if(cur&&cur.text.trim())out.push(cur);cur=null};
  for(const line of txt.split(/\r?\n/)){
    let m=line.match(/^##\s+(?:[^,]+,\s*)?(\d{1,2})\s+de\s+([a-zç]+)\s+de\s+(\d{4})/i);
    if(m&&!line.startsWith('###')){flush();const mi=MONTHS.indexOf(m[2].toLowerCase());day=mi>-1?[+m[3],mi,+m[1]]:null;continue}
    m=line.match(/^##\s+(\d{4})-(\d{2})-(\d{2})/);
    if(m&&!line.startsWith('###')){flush();day=[+m[1],+m[2]-1,+m[3]];continue}
    m=line.match(/^###\s+(\d{1,2}):(\d{2})/);
    if(m&&day){flush();cur={id:uid(),date:new Date(day[0],day[1],day[2],+m[1],+m[2]).toISOString(),text:''};continue}
    if(/^#\s/.test(line)&&!cur)continue;
    if(cur)cur.text+=line+'\n';
  }
  flush();out.forEach(e=>e.text=e.text.trim());return out;
}
$('fileIn').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const txt=await f.text();let list=[];
  try{if(/\.json$/i.test(f.name)||txt.trim().startsWith('{')){const j=JSON.parse(txt);list=(j.entries||j).filter(x=>x.date&&x.text).map(x=>({id:x.id||uid(),date:new Date(x.date).toISOString(),text:String(x.text)}))}
      else list=parseMd(txt)}catch{toast('Ficheiro não reconhecido');return}
  if(!list.length){toast('Não encontrei registos no ficheiro');return}
  const keys=new Set(entries.map(x=>x.date.slice(0,16)+'|'+norm(x.text).slice(0,80)));
  const novos=list.filter(x=>!keys.has(x.date.slice(0,16)+'|'+norm(x.text).slice(0,80)));
  if(!novos.length){toast('Estes registos já estavam no diário');return}
  if(!confirm(`Importar ${novos.length} ${novos.length===1?'registo novo':'registos novos'}?`))return;
  await DB.putMany(novos);await load();show(null);toast(`✔️ ${novos.length} importados`);
};
async function hashPin(p){const salt='diario-v1:';
  if(crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  let h=5381;for(const c of salt+p)h=(h*33^c.charCodeAt(0))>>>0;return'f'+h.toString(16)}
function askPin(msg,cancel,err){return new Promise(res=>{
  $('lockMsg').textContent=msg;$('lockIn').value='';$('lockErr').textContent=err||'';$('lockCancel').hidden=!cancel;$('lock').classList.add('show');
  setTimeout(()=>$('lockIn').focus(),60);
  const done=v=>{$('lock').classList.remove('show');$('lockGo').onclick=$('lockCancel').onclick=$('lockIn').onkeydown=null;res(v)};
  $('lockGo').onclick=()=>{const v=$('lockIn').value;if(!/^\d{4,8}$/.test(v)){$('lockErr').textContent='O PIN tem de ter 4 a 8 números';return}done(v)};
  $('lockIn').onkeydown=e=>{if(e.key==='Enter')$('lockGo').click()};
  $('lockCancel').onclick=()=>done(null);
})}
$('mPin').onclick=async()=>{
  const cur=await DB.getK('pin');
  if(cur){const p=await askPin('PIN atual',true);if(p===null)return;if(await hashPin(p)!==cur){toast('PIN errado');return}
    await DB.delK('pin');toast('🔓 PIN retirado');$('bSettings').click();return}
  const a=await askPin('Novo PIN (4 a 8 números)',true);if(a===null)return;
  const b=await askPin('Repete o PIN',true);if(b===null)return;
  if(a!==b){toast('Os PIN não coincidem');return}
  await DB.setK('pin',await hashPin(a));toast('🔒 PIN definido');$('bSettings').click();
};

const Rec={sr:null,mr:null,stream:null,chunks:[],final:'',interim:'',on:false,t0:0,acc:0,tick:null,lock:null,mode:'',wantAudio:false,restarts:0,got:false,dog:null,lastIn:0,
  SR:window.SpeechRecognition||window.webkitSpeechRecognition,
  async start(){
    this.final='';this.interim='';this.chunks=[];this.acc=0;this.restarts=0;this.got=false;this.mr=null;this.lastIn=0;
    let pref=null;try{this.wantAudio=!!(await DB.getK('audio'));pref=await DB.getK('modo')}catch{}
    this.mode=(!this.SR||pref==='teclado')?'teclado':'texto';
    $('rText').value='';$('rAlarm').classList.remove('show');show('sRec');
    this.go();
  },
  go(){ // nada aqui fica à espera do telemóvel: o ecrã responde sempre
    this.on=true;$('sRec').classList.remove('paused');$('rAlarm').classList.remove('show');
    this.t0=Date.now();clearInterval(this.tick);this.tick=setInterval(()=>this.time(),500);this.time();
    try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>{this.lock=l}).catch(()=>{})}catch{}
    if(this.mode==='texto'){
      $('rKb').hidden=true;this.startSR();
      clearTimeout(this.dog);this.dog=setTimeout(()=>{if(this.on&&!this.got&&this.mode==='texto')this.nudge()},8000);
    }else this.kbShow();
    if(this.wantAudio)this.startMR();
    this.ui();
  },
  ui(){$('rState').textContent=this.mode==='texto'?'A ouvir e a escrever…':'Ditado do teclado';
    $('rText').placeholder=this.mode==='texto'?'Começa a falar…':'O que ditares aparece aqui'},
  nudge(){$('rKbMsg').textContent='Não está a escrever?';$('rKb').hidden=false;$('rAuto').hidden=true},
  kbShow(){$('rKbMsg').textContent='Toca no botão e depois no 🎤 do teclado';$('rKb').hidden=false;$('rAuto').hidden=!this.SR},
  kbMode(byUser){ // passa para o ditado do teclado do iPhone
    clearTimeout(this.dog);const r=this.sr;this.sr=null;try{r&&r.abort()}catch{}
    if(this.interim){this.final=(this.final+' '+this.interim).trim();this.interim='';this.paint()}
    this.mode='teclado';if(byUser){try{DB.setK('modo','teclado')}catch{}}
    this.ui();
  },
  startSR(){
    let r;try{r=new this.SR()}catch{this.kbMode(false);this.kbShow();return}
    this.sr=r;r.lang='pt-PT';r.continuous=true;r.interimResults=true;
    r.onresult=e=>{if(this.sr!==r)return;let it='';for(let i=e.resultIndex;i<e.results.length;i++){const x=e.results[i];
      if(x.isFinal)this.final+=(this.final&&!/\s$/.test(this.final)?' ':'')+x[0].transcript.trim();else it+=x[0].transcript}
      this.interim=it;this.restarts=0;if(!this.got){this.got=true;$('rKb').hidden=true}this.paint()};
    r.onerror=e=>{if(this.sr!==r)return;if(['not-allowed','service-not-allowed','network','audio-capture','language-not-supported'].includes(e.error)){
      this.kbMode(false);this.kbShow();toast('Usa o ditado do teclado')}};
    r.onend=()=>{if(this.sr!==r)return;
      if(this.interim){this.final+=(this.final?' ':'')+this.interim.trim();this.interim='';this.paint()}
      if(!this.on)return;
      if(document.visibilityState==='visible'&&this.restarts<25){this.restarts++;try{r.start();return}catch{}}
      this.stopped()};
    try{r.start()}catch{this.kbMode(false);this.kbShow()}
  },
  startMR(){
    if(this.mr&&this.mr.state==='recording')return;
    if(this.mr&&this.mr.state==='paused'){try{this.mr.resume()}catch{}return}
    try{navigator.mediaDevices.getUserMedia({audio:true}).then(st=>{
      if(!this.on){st.getTracks().forEach(t=>t.stop());return}
      this.stream=st;const mr=new MediaRecorder(st,{audioBitsPerSecond:32000});this.mr=mr;
      mr.ondataavailable=e=>{if(e.data&&e.data.size)this.chunks.push(e.data)};mr.start(1000)}).catch(()=>{})}catch{}
  },
  time(){const now=Date.now(),sec=Math.floor((this.acc+(this.on?now-this.t0:0))/1000);$('rTimer').textContent=`${Math.floor(sec/60)}:${pad(sec%60)}`;
    // ditado do teclado: se deixou de entrar texto há 30 s, avisa
    if(this.on&&this.mode==='teclado'&&this.lastIn&&now-this.lastIn>30000){this.lastIn=0;this.alarm('Parou de escrever?','Toca aqui e depois no 🎤 do teclado');beep()}},
  paint(){const T=$('rText');T.value=(this.final+(this.interim?' '+this.interim:'')).trim();T.scrollTop=T.scrollHeight},
  alarm(t,sub){$('rAlarm').innerHTML=`⚠️ ${t}<br><small>${sub}</small>`;$('rAlarm').classList.add('show')},
  halt(keep){
    clearTimeout(this.dog);this.acc+=this.on?Date.now()-this.t0:0;this.on=false;clearInterval(this.tick);
    const r=this.sr;this.sr=null;try{r&&r.abort()}catch{}
    try{if(this.mr&&this.mr.state==='recording'&&keep)this.mr.pause();else if(this.mr&&this.mr.state!=='inactive')this.mr.stop()}catch{}
    try{this.lock&&this.lock.release()}catch{}this.lock=null},
  stopped(){ // parou sem querer: avisa
    if(!this.on)return;
    if(this.interim){this.final=(this.final+' '+this.interim).trim();this.interim='';this.paint()}
    this.halt(true);$('sRec').classList.add('paused');this.alarm('A gravação parou','Toca aqui para continuar');$('rState').textContent='Parado';beep()},
  save(){ // fecha logo e guarda; nunca fica preso
    let text='';try{text=$('rText').value.trim()}catch{}
    const acc=this.acc+(this.on?Date.now()-this.t0:0);const mr=this.mr;this.mr=null;
    try{this.halt()}catch{}
    try{mr&&mr.state!=='inactive'&&mr.stop()}catch{}
    show(null);
    (async()=>{
      try{
        await new Promise(r=>setTimeout(r,mr?600:0));
        const blob=this.chunks.length?new Blob(this.chunks,{type:this.chunks[0].type||'audio/mp4'}):null;
        try{this.stream&&this.stream.getTracks().forEach(t=>t.stop())}catch{}this.stream=null;
        if(!text&&!blob){toast('Nada gravado');return}
        const id=uid();
        await DB.put({id,date:new Date(Date.now()-acc).toISOString(),text,audio:!!blob});
        if(blob)await DB.req(DB.tx('a','readwrite').put(blob,id));
        await load();toast('✔️ Registo guardado');
      }catch(err){if(text){openEdit(null);$('eText').value=text}toast('Não guardou. O texto está aqui para guardares.')}
    })();
  },
  cancel(){if($('rText').value.trim()&&!confirm('Deitar fora este registo?'))return;
    try{this.halt()}catch{}this.mr=null;try{this.stream&&this.stream.getTracks().forEach(t=>t.stop())}catch{}this.stream=null;show(null)}
};
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)();
  [0,.35,.7].forEach(t=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.value=.25;o.connect(g);g.connect(c.destination);o.start(c.currentTime+t);o.stop(c.currentTime+t+.2)});
  setTimeout(()=>c.close(),1500)}catch{}
  try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch{}}
$('rSave').onclick=()=>Rec.save();
$('rCancel').onclick=()=>Rec.cancel();
$('rAlarm').onclick=()=>{if(Rec.on){$('rAlarm').classList.remove('show');Rec.lastIn=Date.now();$('rText').focus();return}Rec.restarts=0;Rec.go()};
$('rAuto').onclick=()=>{try{DB.delK('modo')}catch{}Rec.mode='texto';Rec.got=false;Rec.restarts=0;Rec.halt();Rec.go()};
$('rKbBtn').onclick=()=>{Rec.kbMode(true);$('rKb').hidden=true;$('rText').focus();Rec.lastIn=Date.now()};
$('rText').oninput=()=>{Rec.final=$('rText').value;Rec.interim='';if(Rec.mode==='teclado')Rec.lastIn=Date.now()};
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'&&Rec.on)Rec.stopped();          // bloqueou o ecrã ou mudou de app
  else if(document.visibilityState==='visible'&&$('rAlarm').classList.contains('show'))beep(); // ao voltar, lembra que parou
});

/* ---------- Atalho da Siri: #add=texto ---------- */
async function fromLink(){
  const m=location.hash.match(/^#add=(.*)$/s);if(!m)return;
  let t='';try{t=decodeURIComponent(m[1].replace(/\+/g,' ')).trim()}catch{}
  history.replaceState(null,'',location.pathname+location.search);
  if(t){await DB.put({id:uid(),date:new Date().toISOString(),text:t});toast('✔️ Registo guardado')}
}

/* ---------- Arranque ---------- */
(async()=>{
  await DB.open();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch{}
  await unlock();await fromLink();await load();
  addEventListener('hashchange',async()=>{if(/^#add=/.test(location.hash)){await fromLink();await load()}});
  if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
